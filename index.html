<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whatsapp Chat UI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <style>
    body{
      background-color:#e0dcd3;
      background-size:cover;
      margin: 0;
      background-repeat: no-repeat;
      height: 100vh;
      display: flex;
      flex-direction: column;
    
    
    }
    .menu_bar{
      background-color: green;
      color: white;
      display:flex;
      justify-content: space-between;
      height: 60px;
      align-items: center;
      flex-shrink: 0;
      
    }
    .left{
      display: flex;
      align-items: center;
      gap: 8px;
    }
   .status-name{
     display: flex;
      flex-direction: column;
      flex: 1;
   }
   .name{ margin: 0; font-weight: 500; font-size: 16px; }
   
    .status { margin: 0; font-size: 14px; font-weight:lighter; opacity: 0.7;}
    
    .right { display: flex; align-items: center; gap: 4px;}
    
    button{
      border: none;
      background: none;
      color: white;
      font-size: 28px;
      cursor: pointer;
      padding: 6px;
    }
  
    
    .Encryption{
      display: flex;
      margin-top: 12px;
      flex-shrink: 0;
      justify-content: center;
      padding: 0 20px;
      
      
    }
    .encrypted {
      background-color:#FFEECE;
      color:#959492;
      font-size: 12px;
      padding: 8px 12px;
      max-width: 400px;
      text-align: Center;
      margin: 0;
    }
    .message_chat{
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      padding: 12px 20px;
      gap: 8px;
      overflow-y: auto;
    }
    .message_1{
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      max-width: 60%;
      align-self: flex-start;
    }
    .message_2{
      background-color: #DCF8C6;
      padding: 8px 12px;
      border-radius: 12px;
      max-width: 60%;
      align-self: flex-end;
    }
    .message_3{
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      max-width: 60%;
      align-self: flex-start;
    }
    .message_4{
      background-color: #DCF8C6;
      padding: 8px 12px;
      border-radius: 12px;
      max-width: 60%;
      align-self: flex-end;
    }
    
    .bottom{
      background-color: #F0F0F0;
      display: flex;
      align-items: center;
      padding: 8px 12px;
      flex-shrink: 0;
      justify-content: space-between;
    }
    .message_input{
      flex-grow: 1;
      border: none;
      padding: 8px 12px;
      border-radius: 20px;
      margin: 0 8px;
    } 

    .emoji{
      font-size: 24px;
      color: #555;
      background: none;
      border: none;
      cursor: pointer;
    }
    .send{
      font-size: 24px;
      color: #01d13c;
      background: none;
      border: none;
      cursor: pointer;
    }
  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
    <div class="menu_bar">
         <div class="left">
           <button class="back">
            <i class="bi bi-arrow-left"> 
            </i>
            </button>
            <button class="avatar">
            <i class="bi bi-person-circle">
             
           </i>
         </button>
          <div class="status-name">
            <p class="name">
           Becky
         </p>
         <p class="status">
           online 
         </p>
          </div>
        
         </div>
         
         <div class="right">
           <button class="video_call">
             <i class="bi bi-camera-video-fill">
               
             </i>
           </button>
          
           <button class="audio_call">
             <i class="bi bi-telephone-fill">
             </i>
           </button>
           
            <button class="menu">
              <i class="bi bi-three-dots-vertical">
              </i>
            </button >
          </div>
      </div>
      <div class="Encryption">
          <p class="encrypted">
            🔒Messages and calls are end-to-end encrypted. No one outside of this chat can read or listen to them. Tap to learn more.
          </p>
      </div>
      
      <div class="message_chat">
        <p class="message_1">Hey! How are you? 👋</p>
        <p class="message_2">I'm good, thanks! You?</p>
        <p class="message_3">Pretty great. Working on this chat UI 😄</p>
        <p class="message_4">It's looking clean 🔥</p>
      </div>
    
      
      <div class="bottom">
        <button class="emoji">
          <i class="bi bi-emoji-smile"></i>
        </button>
        <input type="text" placeholder="Message" class="message_input">
        <button class="send">
          <i class="bi bi-send-fill"></i>
        </button>

      </div>
</body>
</html>
